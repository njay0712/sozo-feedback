  <style>
/* Sozo Foundation – Bootcamp feedback survey
   Layout: dark brand band with logo, then one narrow column of question cards. */

:root {
  --ink: #0B0C12;          /* logo background */
  --paper: #F6F7F9;
  --card: #FFFFFF;
  --text: #1A1C24;
  --muted: #5D6170;
  --line: #DEE1E8;
  --amber: #EDB96F;        /* the four logo stripes */
  --teal: #5EB9BA;
  --pink: #EF8496;
  --blue: #86BFDD;
  --focus: #2E8F90;
  --error: #C2334D;
  --font: "Quicksand", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --script: "Caveat", "Segoe Print", cursive;
}

* { box-sizing: border-box; }
html, body { margin: 0; }

body {
  background: var(--paper);
  color: var(--text);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Header */
header {
  background: var(--ink);
  color: #E9E9EC;
  text-align: center;
  padding: 28px max(16px, env(safe-area-inset-right)) 26px max(16px, env(safe-area-inset-left));
}
header img { width: min(220px, 60vw); height: auto; display: block; margin: 0 auto; }
header h1 {
  font-size: 1.15rem; font-weight: 700; letter-spacing: .02em;
  margin: 18px auto 4px; max-width: 30ch; text-wrap: balance;
}
header p { margin: 0; color: #A9ACB8; font-size: .92rem; }

.stripes { display: grid; grid-template-columns: repeat(4, 1fr); height: 5px; }
.stripes span:nth-child(1) { background: var(--amber); }
.stripes span:nth-child(2) { background: var(--teal); }
.stripes span:nth-child(3) { background: var(--pink); }
.stripes span:nth-child(4) { background: var(--blue); }

/* Progress bar */
.progress {
  position: sticky; top: 0; z-index: 5;
  background: rgba(246, 247, 249, .94);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
}
.progress-inner {
  max-width: 640px; margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
  font-size: .85rem; color: var(--muted); font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--amber), var(--teal), var(--pink), var(--blue));
  transition: width .3s ease;
}

/* Form */
main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
form { display: grid; gap: 16px; }

fieldset {
  border: 1px solid var(--line); border-radius: 14px;
  background: var(--card); margin: 0; padding: 18px 16px 16px;
  min-width: 0;
}
fieldset.invalid {
  border-color: var(--error);
  box-shadow: 0 0 0 3px rgba(194, 51, 77, .15);
}
legend { padding: 0; float: left; width: 100%; margin-bottom: 12px; font-weight: 700; font-size: 1.02rem; }
legend .num {
  display: block; font-size: .75rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 2px;
}
.err { clear: both; color: var(--error); font-size: .85rem; font-weight: 600; margin: 10px 0 0; }

/* Answer options: big tap targets */
.opts { clear: both; display: grid; gap: 8px; }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt label {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; min-height: 48px;
  border: 1.5px solid var(--line); border-radius: 10px;
  cursor: pointer; font-weight: 600;
  transition: border-color .15s, background .15s;
}
.opt label::before {
  content: ""; flex: none; width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid #A9ADBA; background: #fff; transition: all .15s;
}
.opt input:checked + label { border-color: var(--teal); background: #EEF7F7; }
.opt input:checked + label::before { border-color: var(--teal); background: var(--teal); box-shadow: inset 0 0 0 4px #fff; }
.opt input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
@media (hover: hover) { .opt label:hover { border-color: #B5BAC6; } }

textarea {
  clear: both; display: block; width: 100%; min-height: 120px; resize: vertical;
  font: inherit; color: inherit; padding: 12px 14px;
  border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
}
textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-color: var(--teal); }
.count { text-align: right; font-size: .8rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

button[type="submit"] {
  font: inherit; font-weight: 700; font-size: 1.05rem; color: #fff;
  background: var(--ink); border: 0; border-radius: 12px;
  padding: 15px 20px; min-height: 54px; width: 100%; cursor: pointer;
}
button[type="submit"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
button[type="submit"][disabled] { opacity: .6; cursor: progress; }
.form-error { color: var(--error); font-weight: 600; text-align: center; margin: 0; }

/* Email + consent */
input[type="email"] {
  clear: both; display: block; width: 100%;
  font: inherit; color: inherit; padding: 12px 14px; min-height: 48px;
  border: 1.5px solid var(--line); border-radius: 10px; background: #fff;
}
input[type="email"]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-color: var(--teal); }
.hint { clear: both; font-size: .85rem; color: var(--muted); margin: -6px 0 10px; }
.consent { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; font-weight: 600; font-size: .95rem; cursor: pointer; }
.consent input { flex: none; width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--teal); cursor: pointer; }

/* Spam trap stays off-screen */
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

/* Thank-you screen */
.thanks { text-align: center; padding: 32px 8px; }
.thanks h2 { font-family: var(--script); font-weight: 500; font-size: 2.6rem; margin: 0 0 8px; line-height: 1.1; }
.thanks p { color: var(--muted); max-width: 40ch; margin: 0 auto; }

footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 0 16px 32px; }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

    <h1>2nd Annual Networking Bootcamp – Attendee Feedback</h1>
    <p>8 quick questions and your email · about 2 minutes</p>
  </header>
  <div class="stripes" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <div class="progress" id="progressWrap">
    <div class="progress-inner">
      <div class="bar" id="bar" role="progressbar" aria-label="Survey progress" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0"><i id="barFill"></i></div>
      <span id="progressText">0 of 9</span>
    </div>
  </div>

  <main>
    <!-- Questions are added to this form by script.js -->
    <form id="survey" novalidate>
      <!-- Spam trap: people never see this field, bots fill it in -->
      <div class="trap" aria-hidden="true">
        <label for="website">Leave this empty</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>
    </form>

    <section class="thanks" id="thanks" hidden aria-live="polite">
      <h2>Thank you!</h2>
      <p>Your feedback has been received. Look out for an email with the bootcamp slides.</p>
    </section>

    <noscript><p class="form-error">Please turn on JavaScript to complete this survey.</p></noscript>
  </main>

  <footer>The Sozo Foundation · We never share your email address</footer>

  <script>
/* Sozo Foundation – Bootcamp feedback survey
 *
 * STEP: paste your Google Apps Script web app URL (ends in /exec) below.
 */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHn_wL55zREoH2qjXfIHBnF2oB74txgeUou6CuIeJOSG-BzlFxQQDJBS1TL2rfL6SNjw/exec";

const QUESTIONS = [
  { id: "q1", text: "How would you rate your overall bootcamp experience?",
    options: ["Excellent", "Good", "Average", "Poor"] },
  { id: "q2", text: "How relevant were the topics to your business needs?",
    options: ["Very relevant", "Somewhat relevant", "Slightly relevant", "Not relevant"] },
  { id: "q3", text: "Which session did you find most valuable?",
    options: ["Market Analysis", "Corporate Identity", "Business Insurance", "Financial Learning App", "Building Systems to Scale", "Entrepreneurial Growth Panel"] },
  { id: "q4", text: "How confident are you that you can apply what you learnt?",
    options: ["Very confident", "Somewhat confident", "Not confident yet"] },
  { id: "q5", text: "Did you make valuable connections with other entrepreneurs or business leaders?",
    options: ["Yes, several", "Yes, a few", "Not yet"] },
  { id: "q6", text: "Which area would you like more support in?",
    options: ["Marketing & customer growth", "Financial management", "Business systems & scaling", "Access to funding", "Leadership & team management", "Mentorship & networking"] },
  { id: "q7", text: "Would you attend or recommend future Sozo Networking Bootcamps?",
    options: ["Definitely", "Maybe", "No"] },
  { id: "q8", text: "What was your biggest takeaway from today, or what could we improve for next year?",
    open: true }
];
const MAX_TEXT = 1000;

const form = document.getElementById("survey");
const formError = document.createElement("p");
const submitBtn = document.createElement("button");

/* ---------- Build the form ---------- */

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text != null) node.textContent = text;
  return node;
}

QUESTIONS.forEach((q, i) => {
  const fs = el("fieldset", { id: "fs-" + q.id });
  const legend = el("legend");
  legend.appendChild(el("span", { class: "num" }, `Question ${i + 1}${q.open ? " · optional" : ""}`));
  legend.appendChild(document.createTextNode(q.text));
  fs.appendChild(legend);

  if (q.open) {
    const ta = el("textarea", {
      id: q.id, name: q.id, maxlength: MAX_TEXT,
      placeholder: "Type your answer here…", "aria-describedby": q.id + "-count"
    });
    const count = el("div", { class: "count", id: q.id + "-count" }, `0 / ${MAX_TEXT}`);
    ta.addEventListener("input", () => {
      count.textContent = `${ta.value.length} / ${MAX_TEXT}`;
      updateProgress();
    });
    fs.append(ta, count);
  } else {
    const opts = el("div", { class: "opts" });
    q.options.forEach((option, j) => {
      const id = `${q.id}-${j}`;
      const wrap = el("div", { class: "opt" });
      const input = el("input", { type: "radio", name: q.id, id, value: option });
      input.addEventListener("change", () => {
        clearError(fs);
        updateProgress();
      });
      wrap.append(input, el("label", { for: id }, option));
      opts.appendChild(wrap);
    });
    fs.appendChild(opts);
  }
  form.appendChild(fs);
});

/* Contact details (optional) */
const contact = el("fieldset", { id: "fs-email" });
const cLegend = el("legend");
cLegend.appendChild(el("span", { class: "num" }, "Your details · required"));
cLegend.appendChild(document.createTextNode("Email address"));
contact.appendChild(cLegend);
contact.appendChild(el("p", { class: "hint", id: "email-hint" }, "We'll email you the bootcamp slides."));
const emailInput = el("input", {
  type: "email", id: "email", name: "email", autocomplete: "email",
  inputmode: "email", maxlength: "254", placeholder: "you@example.com", required: "", "aria-describedby": "email-hint"
});
const consentLabel = el("label", { class: "consent", for: "consent" });
const consentBox = el("input", { type: "checkbox", id: "consent", name: "consent" });
consentLabel.append(consentBox, document.createTextNode("Also keep me updated about future Sozo bootcamps and support (optional)."));
contact.append(emailInput, consentLabel);
emailInput.addEventListener("input", () => { clearError(contact); updateProgress(); });
consentBox.addEventListener("change", () => clearError(contact));
form.appendChild(contact);

formError.className = "form-error";
formError.setAttribute("role", "alert");
formError.hidden = true;
submitBtn.type = "submit";
submitBtn.textContent = "Submit feedback";
form.append(formError, submitBtn);

/* ---------- Helpers ---------- */

function collect() {
  const data = {};
  QUESTIONS.forEach(q => {
    if (q.open) {
      data[q.id] = document.getElementById(q.id).value.trim();
    } else {
      const checked = form.querySelector(`input[name="${q.id}"]:checked`);
      data[q.id] = checked ? checked.value : "";
    }
  });
  data.email = document.getElementById("email").value.trim();
  data.consent = document.getElementById("consent").checked ? "Yes" : "No";
  data.website = document.getElementById("website").value; // spam trap
  return data;
}

function updateProgress() {
  const data = collect();
  const total = QUESTIONS.length + 1; // + email
  const answered = QUESTIONS.filter(q => data[q.id]).length + (data.email ? 1 : 0);
  document.getElementById("barFill").style.width = (answered / total * 100) + "%";
  document.getElementById("bar").setAttribute("aria-valuenow", answered);
  document.getElementById("progressText").textContent = `${answered} of ${total}`;
}

function clearError(fs) {
  fs.classList.remove("invalid");
  const old = fs.querySelector(".err");
  if (old) old.remove();
}

function showThanks() {
  form.hidden = true;
  document.getElementById("progressWrap").hidden = true;
  document.getElementById("thanks").hidden = false;
  window.scrollTo(0, 0);
}

function showSendError(message) {
  submitBtn.disabled = false;
  submitBtn.textContent = "Submit feedback";
  formError.textContent = message || "Your answers didn't send. Check your connection and tap Submit again.";
  formError.hidden = false;
}

/* ---------- Submit ---------- */

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  formError.hidden = true;

  const data = collect();
  let firstMissing = null;
  QUESTIONS.forEach(q => {
    const fs = document.getElementById("fs-" + q.id);
    clearError(fs);
    if (!q.open && !data[q.id]) {
      fs.classList.add("invalid");
      fs.appendChild(el("p", { class: "err" }, "Please choose an answer."));
      if (!firstMissing) firstMissing = fs;
    }
  });
  const contactFs = document.getElementById("fs-email");
  clearError(contactFs);
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  let contactMsg = "";
  if (!data.email) contactMsg = "Please enter your email so we can send you the slides.";
  else if (!EMAIL_RE.test(data.email)) contactMsg = "Check your email address, e.g. name@example.com.";
  if (contactMsg) {
    contactFs.classList.add("invalid");
    contactFs.appendChild(el("p", { class: "err" }, contactMsg));
    if (!firstMissing) firstMissing = contactFs;
  }

  if (firstMissing) {
    firstMissing.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  if (!SCRIPT_URL.startsWith("https://script.google.com/")) {
    showSendError("This survey isn't connected yet. Add the Apps Script link to script.js.");
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Sending…";

  try {
    // Form-encoded POST is a "simple" request, so the browser sends it to Apps Script without a CORS preflight.
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      body: new URLSearchParams(data)
    });
    const result = await res.json();
    if (result.ok) showThanks();
    else showSendError(result.error);
  } catch (err) {
    showSendError();
  }
});
</script>
</body>
</html>
